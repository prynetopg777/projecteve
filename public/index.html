<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E.V.E.</title>
<style>
  /* ---------- Design tokens ----------
     Direction: a quiet instrument. Calm, flat surfaces with hairline borders, and one accent colour that
     always means "what Eve is doing right now" (cyan idle, teal listening, amber thinking or waiting for you,
     violet speaking). The orb is the only expressive element; everything else stays out of the way. */
  :root {
    color-scheme: dark;
    /* Surfaces, darkest to most raised */
    --bg-0: #060a12;
    --bg-1: #0b121d;
    --bg-2: #101a28;
    --bg-3: #172334;
    --line: rgba(160, 196, 224, .10);
    --line-2: rgba(160, 196, 224, .18);
    --line-3: rgba(160, 196, 224, .30);
    /* Text: primary, secondary, tertiary (all at least 4.5:1 on --bg-1) */
    --text: #e7eef5;
    --text-2: #a9b9c9;
    --text-3: #7f93a7;
    /* State and semantic colours */
    --c-idle: #62d6f0;
    --c-listen: #3fe3b4;
    --c-think: #f3b552;
    --c-speak: #ad92ff;
    --c-ok: #63dc9f;
    --c-warn: #f3b552;
    --c-danger: #ff7272;
    --c-off: #6c7f92;
    --accent: var(--c-idle);
    /* Type */
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    --font-mono: "Cascadia Code", "Cascadia Mono", Consolas, monospace;
    --fs-xs: .75rem;
    --fs-sm: .8125rem;
    --fs-md: 1rem;
    --fs-lg: 1.125rem;
    /* Space (4 px grid) and shape */
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
    --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-pill: 999px;
    /* Motion */
    --ease: cubic-bezier(.2, .8, .2, 1);
    --t-fast: 120ms;
    --t-med: 240ms;
  }
  body[data-state="listening"] { --accent: var(--c-listen); }
  body[data-state="thinking"] { --accent: var(--c-think); }
  body[data-state="speaking"] { --accent: var(--c-speak); }
  body[data-state="permission"] { --accent: var(--c-warn); }
  body[data-state="offline"] { --accent: var(--c-off); }

  * { box-sizing: border-box; }
  html { font-size: clamp(14px, .4vw + 9px, 18px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse 70% 50% at 30% 0%, #0c1a2b 0%, transparent 70%), var(--bg-0);
    color: var(--text);
    font: var(--fs-md)/1.55 var(--font);
    font-feature-settings: "tnum" 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-columns: minmax(0, 1fr);
    max-width: 760px;
    margin: 0 auto;
    padding: 0 var(--s3);
    overflow: hidden;
  }
  ::selection { background: rgba(98, 214, 240, .28); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-3); }
  ::-webkit-scrollbar-track { background: transparent; }
  :focus-visible { outline: 2px solid var(--c-idle); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Header ---------- */
  header {
    position: relative; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
    padding: var(--s3) var(--s1);
  }
  .brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
  .wordmark { font: 600 var(--fs-md)/1 var(--font-display); letter-spacing: .24em; color: var(--text); padding-left: .24em; }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); transition: background var(--t-med); }
  body:not([data-state="idle"]):not([data-state="offline"]) .brand-dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .model, .taskchip {
    font-size: var(--fs-xs); line-height: 1; color: var(--text-3); white-space: nowrap;
    border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 5px 9px;
  }
  .model:empty { display: none; }
  .taskchip { color: var(--c-ok); border-color: rgba(99, 220, 159, .35); cursor: help; }
  .taskchip[hidden] { display: none; }
  .controls { position: relative; display: flex; align-items: center; gap: var(--s2); flex: none; }

  /* ---------- Buttons ---------- */
  button {
    font: inherit; font-size: var(--fs-sm); line-height: 1; color: var(--text-2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; min-height: 34px;
    background: transparent; border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 0 var(--s3);
    transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
  }
  button svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  button:hover:not(:disabled) { color: var(--text); border-color: var(--line-3); background: var(--bg-2); }
  button:active:not(:disabled) { background: var(--bg-3); }
  button:disabled { opacity: .4; cursor: default; }
  /* Toggles: aria-pressed carries the state, the label stays the same */
  button[aria-pressed="true"] { color: var(--text); border-color: var(--line-3); background: var(--bg-2); }
  button[aria-pressed="true"] .tick { background: var(--c-ok); }
  .tick { width: 6px; height: 6px; border-radius: 50%; background: var(--line-3); flex: none; transition: background var(--t-fast); }
  #autoBtn[aria-pressed="true"] { color: var(--c-warn); border-color: rgba(243, 181, 82, .45); background: rgba(243, 181, 82, .08); }
  #stopBtn:not(:disabled) { color: var(--text); border-color: rgba(255, 114, 114, .45); }
  #stopBtn:not(:disabled):hover { background: rgba(255, 114, 114, .1); }
  .btn-primary { color: #04121a; background: var(--text); border-color: var(--text); font-weight: 600; }
  .btn-primary:hover:not(:disabled) { color: #04121a; background: #ffffff; border-color: #ffffff; }
  kbd { font: var(--fs-xs) var(--font-mono); color: var(--text-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 4px; }

  /* ---------- Settings popover ---------- */
  .settings {
    position: absolute; top: calc(100% + var(--s2)); right: 0; z-index: 20; width: 280px;
    display: flex; flex-direction: column; padding: var(--s2);
    border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--bg-2);
    box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
  }
  .settings[hidden] { display: none; }
  .histpanel {
    position: fixed; inset: 64px max(var(--s4), calc(50% - 360px)) var(--s4); z-index: 30;
    display: flex; flex-direction: column; border: 1px solid var(--line-2); border-radius: var(--r-md);
    background: var(--bg-2); box-shadow: 0 16px 40px rgba(0, 0, 0, .5);
  }
  .histpanel[hidden] { display: none; }
  .settings .keys { margin: var(--s2) var(--s2) 0; font-size: 12px; color: var(--text-2); }
  .log .past { opacity: .6; }
  .log .divider { text-align: center; font-size: 12px; color: var(--text-2); border: 0; background: none; }
  .histhead { display: flex; justify-content: space-between; align-items: center; padding: var(--s3) var(--s4); border-bottom: 1px solid var(--line); }
  .histlist { overflow-y: auto; padding: var(--s2) var(--s4); font-size: var(--fs-sm); color: var(--text-2); }
  .histitem { padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .histitem time { font-size: 12px; color: var(--text-3, var(--text-2)); }
  .histitem p { margin: var(--s1) 0 0; white-space: pre-wrap; }
  .histitem .q { color: var(--text); font-weight: 600; }
  .settings label, .settings .row {
    display: flex; justify-content: space-between; align-items: center; gap: var(--s3);
    padding: var(--s2); font-size: var(--fs-sm); color: var(--text-2); border-radius: var(--r-sm);
  }
  .settings .row button { min-height: 30px; }
  .settings hr { border: 0; border-top: 1px solid var(--line); margin: var(--s1) 0; }
  .settings .wide { justify-content: center; width: 100%; border-color: transparent; color: var(--text-2); }
  .settings .wide:hover { border-color: var(--line-2); }
  select {
    font: inherit; font-size: var(--fs-sm); color: var(--text); background: var(--bg-1);
    border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 6px 8px; width: 150px; cursor: pointer;
  }
  select:hover { border-color: var(--line-3); }
  select option { background: var(--bg-1); }

  /* ---------- Layout ---------- */
  main { display: flex; flex-direction: column; min-height: 0; gap: var(--s3); padding-bottom: var(--s3); }

  /* Presence: the orb, what Eve is doing, and what she's hearing */
  .stage { display: flex; align-items: center; gap: var(--s4); flex: none; min-width: 0; padding: 0 var(--s1); }
  .reactor { position: relative; width: 76px; aspect-ratio: 1; flex: none; cursor: pointer; border-radius: 50%; transition: transform var(--t-med) var(--ease); }
  .reactor:hover { transform: scale(1.04); }
  .reactor:focus-visible { outline-offset: 6px; }
  .reactor canvas { position: absolute; inset: -14%; width: 128%; height: 128%; pointer-events: none; }
  .presence { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .wave { display: none; }
  .state { font: 600 var(--fs-lg)/1.3 var(--font-display); color: var(--text); transition: color var(--t-med); }
  .state::first-letter { text-transform: uppercase; }
  .state-sub { font-size: var(--fs-sm); color: var(--text-3); }
  body:not([data-state="idle"]) .state { color: var(--accent); }
  .interim { font-size: var(--fs-sm); color: var(--c-listen); min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .interim:empty { display: none; }
  .interim:not(:empty) + .state-sub { display: none; }

  /* Conversation panel: transcript plus composer */
  .panel {
    flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column;
    background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
  }
  .log {
    flex: 1; overflow-y: auto; min-height: 0; min-width: 0; padding: var(--s5) var(--s5) var(--s4);
    display: flex; flex-direction: column; gap: var(--s3); scroll-behavior: smooth;
  }
  .log > * { animation: rise var(--t-med) var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .msg { max-width: min(68ch, 100%); white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .msg.user {
    align-self: flex-end; max-width: min(60ch, 85%); padding: 9px 14px;
    background: var(--bg-3); border: 1px solid var(--line-2); border-radius: 16px 16px 6px 16px;
  }
  .msg.eve { align-self: flex-start; padding: 2px 0 2px var(--s4); border-left: 2px solid rgba(98, 214, 240, .45); }
  .msg.stat { align-self: flex-start; margin: calc(-1 * var(--s2)) 0 var(--s1) var(--s4); font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; white-space: normal; }
  .msg.system { align-self: center; max-width: 52ch; text-align: center; font-size: var(--fs-sm); color: var(--text-3); padding: 0 var(--s4); }
  .msg.reminder, .msg.error {
    align-self: stretch; max-width: none; padding: var(--s3) var(--s4); white-space: normal;
    border: 1px solid var(--line); border-left: 3px solid; border-radius: var(--r-sm); background: var(--bg-2);
    display: flex; align-items: center; justify-content: space-between; gap: var(--s3);
  }
  .msg.reminder { border-left-color: var(--c-warn); color: var(--text); }
  .msg.error { border-left-color: var(--c-danger); color: var(--text); font-size: var(--fs-sm); }
  .msg.error button { flex: none; }

  /* Tool steps: running steps pulse, finished ones get a tick */
  .tool { align-self: flex-start; display: flex; align-items: center; gap: var(--s2); padding-left: var(--s4); font-size: var(--fs-sm); color: var(--text-3); }
  .tool::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c-think); flex: none; animation: pulse 1.2s ease-in-out infinite; }
  .tool.done::before { content: "✓"; width: auto; height: auto; background: none; color: var(--c-ok); font-size: var(--fs-xs); animation: none; }
  .tool.stopped::before { content: "–"; width: auto; height: auto; background: none; color: var(--text-3); animation: none; }
  .tool + .tool { margin-top: calc(-1 * var(--s2)); }

  /* Thinking placeholder while no words have arrived yet */
  .working { align-self: flex-start; display: flex; gap: 5px; padding: var(--s2) 0 var(--s2) var(--s4); }
  .working i { width: 6px; height: 6px; border-radius: 50%; background: var(--c-think); animation: pulse 1.2s ease-in-out infinite; }
  .working i:nth-child(2) { animation-delay: .2s; }
  .working i:nth-child(3) { animation-delay: .4s; }

  /* Code and data blocks inside replies */
  pre {
    position: relative; margin: var(--s2) 0; padding: var(--s3) var(--s4); overflow-x: auto; white-space: pre;
    font: var(--fs-sm)/1.55 var(--font-mono); color: #cfe3f1;
    background: var(--bg-0); border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .msg.eve > pre:first-child { margin-top: 0; }
  .codebox { position: relative; }
  .copy { position: absolute; top: 6px; right: 6px; min-height: 26px; padding: 0 var(--s2); font-size: var(--fs-xs); background: var(--bg-2); opacity: 0; transition: opacity var(--t-fast); }
  .codebox:hover .copy, .copy:focus-visible { opacity: 1; }
  @media (hover: none) { .copy { opacity: 1; } }
  .viz { margin: var(--s2) 0; padding: var(--s3) var(--s4); border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-0); white-space: normal; }
  .viz-title { font-size: var(--fs-sm); font-weight: 600; color: var(--text); margin-bottom: var(--s2); }
  .viz-svg { display: block; width: 100%; max-width: 460px; height: auto; }
  .viz-t { font: 10px var(--font); fill: #93a8bb; }
  .viz-grid { stroke: rgba(160, 196, 224, .12); stroke-width: 1; }
  .viz-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: var(--s2); font-size: var(--fs-xs); color: var(--text-2); }
  .viz-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--c); margin-right: 6px; }
  .viz-wait { color: var(--text-3); font-size: var(--fs-sm); font-style: italic; }

  /* Permission request: stays pinned to the bottom of the transcript until answered */
  .perm {
    align-self: stretch; min-width: 0; padding: var(--s4); white-space: normal;
    background: var(--bg-2); border: 1px solid rgba(243, 181, 82, .45); border-radius: var(--r-md);
    box-shadow: 0 -12px 24px var(--bg-1);
  }
  .perm:not(.done) { position: sticky; bottom: 0; z-index: 2; }
  .perm-eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--c-warn); margin-bottom: var(--s1); }
  .perm-title { font-weight: 600; color: var(--text); }
  .perm pre { max-height: 180px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .perm.task pre { font-family: var(--font); color: var(--text-2); }
  .perm-actions { display: flex; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s3); }
  .perm-actions .deny { color: var(--c-danger); border-color: rgba(255, 114, 114, .4); }
  .perm-actions .deny:hover { background: rgba(255, 114, 114, .1); color: var(--c-danger); }
  .perm-hint { color: var(--text-3); font-size: var(--fs-xs); margin-top: var(--s2); }
  .perm.done { border-color: var(--line); background: transparent; box-shadow: none; padding: var(--s2) var(--s4); }
  .perm.done pre, .perm.done .perm-eyebrow { display: none; }
  .perm.done .perm-title { font-weight: 400; color: var(--text-2); font-size: var(--fs-sm); }
  .perm-result { margin-top: 2px; font-size: var(--fs-sm); color: var(--text-3); }
  .perm-result.allow, .perm-result.always { color: var(--c-ok); }
  .perm-result.deny { color: var(--c-danger); }

  .banner {
    display: flex; gap: var(--s3); align-items: center; justify-content: space-between; padding: var(--s2) var(--s2) var(--s2) var(--s4);
    font-size: var(--fs-sm); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r-md); background: var(--bg-2);
  }
  .banner[hidden] { display: none; }

  /* Starter suggestions, shown until the first request */
  .hints { display: flex; flex-wrap: wrap; gap: var(--s2); padding: 0 var(--s5) var(--s3); }
  .hints[hidden] { display: none; }
  .hints button { min-height: 30px; font-size: var(--fs-xs); color: var(--text-2); }

  /* Composer */
  form { display: flex; align-items: center; gap: var(--s2); padding: var(--s3); border-top: 1px solid var(--line); background: var(--bg-1); }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; color: var(--text); min-height: 44px;
    background: var(--bg-0); border: 1px solid var(--line-2); border-radius: var(--r-pill); padding: 0 var(--s4); outline: none;
    transition: border-color var(--t-fast);
  }
  input[type=text]::placeholder { color: var(--text-3); }
  input[type=text]:focus { border-color: var(--line-3); }
  input[type=text]:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(98, 214, 240, .18); }
  .mic, .send { width: 44px; height: 44px; min-height: 44px; padding: 0; justify-content: center; flex: none; }
  .mic svg, .send svg { width: 20px; height: 20px; }
  .mic { color: var(--text); }
  .send { color: #04121a; background: var(--text); border-color: var(--text); }
  .send:hover:not(:disabled) { color: #04121a; background: #fff; }
  .mic[hidden], .send[hidden] { display: none; }
  body[data-state="listening"] .mic { color: #04121a; background: var(--c-listen); border-color: var(--c-listen); animation: ring 1.4s ease-out infinite; }
  @keyframes ring { from { box-shadow: 0 0 0 0 rgba(63, 227, 180, .45); } to { box-shadow: 0 0 0 10px rgba(63, 227, 180, 0); } }

  /* ---------- Start screen (browsers need one click before audio and the mic) ---------- */
  .boot { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--bg-0); }
  .boot > div { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--s5); }
  .boot-orb {
    width: 88px; height: 88px; border-radius: 50%; margin-bottom: var(--s5);
    background: radial-gradient(circle, #f1fcff 0%, var(--c-idle) 26%, rgba(98, 214, 240, .14) 58%, transparent 72%);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  .boot h1 { font: 600 1.75rem/1.2 var(--font-display); letter-spacing: .24em; padding-left: .24em; margin: 0 0 var(--s1); }
  .boot .tagline { color: var(--text-3); font-size: var(--fs-sm); margin: 0 0 var(--s5); }
  .boot button { min-height: 44px; padding: 0 var(--s6); font-size: var(--fs-md); }
  .boot p#bootNote { color: var(--text-3); font-size: var(--fs-sm); margin: var(--s4) 0 0; max-width: 34ch; }

  /* ---------- Wide windows: presence on the left, conversation on the right ---------- */
  @media (min-width: 900px) and (min-height: 560px) {
    body { max-width: 1240px; padding: 0 var(--s5); }
    header { padding: var(--s4) 0; }
    main { display: grid; grid-template-columns: minmax(280px, .85fr) minmax(0, 1.4fr); grid-template-rows: auto minmax(0, 1fr); gap: var(--s4) var(--s5); padding-bottom: var(--s5); }
    .banner { grid-column: 1 / -1; }
    .stage { grid-column: 1; grid-row: 2; flex-direction: column; justify-content: center; gap: var(--s3); text-align: center; }
    .reactor { width: clamp(180px, 34vh, 300px); }
    .wave { display: block; width: min(360px, 90%); height: 36px; }
    .presence { align-items: center; }
    .interim { white-space: normal; max-width: 36ch; }
    .panel { grid-column: 2; grid-row: 2; }
  }
  @media (min-width: 1600px) and (min-height: 800px) {
    body { max-width: min(1560px, 92vw); }
    .reactor { width: clamp(260px, 38vh, 420px); }
  }
  /* Short windows */
  @media (max-height: 640px) {
    header { padding: var(--s2) var(--s1); }
    .log { padding: var(--s4) var(--s4) var(--s3); }
  }
  /* Phones: icon-only header controls, compact presence strip */
  @media (max-width: 600px) {
    body { padding: 0 var(--s2); }
    header { padding: var(--s2) 0; }
    .controls { gap: 6px; }
    .controls > button .label, .model { display: none; }
    .settings { width: min(280px, calc(100vw - 16px)); }
    .controls > button { width: 36px; padding: 0; justify-content: center; }
    .reactor { width: 56px; }
    .state { font-size: var(--fs-md); }
    .log { padding: var(--s4) var(--s3) var(--s3); }
    .hints { padding: 0 var(--s3) var(--s3); }
    .msg.user { max-width: 90%; }
    .msg.eve { padding-left: var(--s3); }
    .tool { padding-left: var(--s3); }
    form { padding: var(--s2); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; scroll-behavior: auto !important; }
  }

// ---------- Visuals: animated orb + waveform (purely cosmetic; reads body[data-state]) ----------

  const palette = { // r, g, b, energy, spin speed
    idle:       [56, 232, 255, .10, .25],
    listening:  [45, 255, 196, .45, .6],
    thinking:   [255, 181, 71, .30, 2.4],
    speaking:   [185, 140, 255, .60, .9],
    permission: [255, 170, 60, .40, .5],

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wakeMode = false, pushToTalk = false, awaitingCommand = 0, paused = false;
// Extra ways the recognizer mishears "Eve" (especially with the Filipino model).
const EXTRA_ALIASES = ['eeve', 'evi', 'ebi', 'ibi', 'ava', 'iva', 'evo', 'ebby', 'eevee'];
const wakeList = [...new Set([CFG.wakeWord, ...(CFG.wakeAliases || []), ...EXTRA_ALIASES].map((w) => w.toLowerCase()))];
const wakeNames = wakeList.join('|');
// Real words that look like the wake word; never treated as a mishearing.
const NOT_WAKE = new Set(['even', 'ever', 'eye', 'eyes', 'ewe', 'aye', 'ave', 'abe', 'eli', 'eat', 'ate', 'eve\'s', 'evil', 'ivy']);
const lev = (a, b) => {
  const d = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    let p = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1)); p = t; }
  }
  return d[b.length];
};
// First word of an utterance (or the one after "hey") that is one letter off a wake name becomes the wake word.
function fuzzyWake(text) {
  const m = text.match(/^((?:hey|ok|okay|uy|hoy)[\s,]+)?([a-z']+)([\s\S]*)$/i);
  if (!m) return text;
  const w = m[2].toLowerCase().replace(/'/g, '');
  if (w.length < 2 || w.length > 5 || NOT_WAKE.has(w) || wakeList.includes(w)) return text;
  return wakeList.some((n) => n.length >= 3 && Math.abs(n.length - w.length) <= 1 && lev(w, n) <= 1) ? (m[1] || '') + CFG.wakeWord + m[3] : text;
}
const wakeRe = new RegExp(`\\b(?:hey |ok |okay |uy |hoy )?(?:${wakeNames})\\b[\\s,.!?]*(.*)`, 'i');
// English and Filipino stop words: "stop", "tama na", "tigil"…
const STOP_WORDS = 'stop|cancel|never ?mind|shut up|be quiet|tama na|tigil|hinto|(?:hu)?wag na|ayoko na';
const stopRe = new RegExp(`^((?:${wakeNames})[, ]+)?(${STOP_WORDS})\\.?$`, 'i');

// Each recognizer instance `r` only touches shared state while it is still the current `rec`,
// so aborting one and starting another can't race.
function startRec() {
  if (!SR || rec || (paused && !pushToTalk)) return;
  const r = new SR();
  rec = r;
  r.ptt = pushToTalk;
  r.lang = localStorage.getItem('eveLang') || CFG.speechLang || navigator.language || 'en-US'; // fil-PH also understands English and Taglish
  r.continuous = true; // push-to-talk too: the silence timer decides when you're done, not the browser
  r.interimResults = true;
  r.maxAlternatives = 3; // lets us pick the guess that contains the wake word
  r.t0 = Date.now();
  r.onstart = () => {
    listening = r.ptt || awaitingCommand > Date.now(); render();
    if (r.ptt) setTimeout(() => { if (rec === r && !heard && !heardInterim) r.stop(); }, 8000); // nothing said
  };
  r.onresult = (e) => {
    if (rec !== r) return;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      let text = res[0].transcript.trim();
      if (!res.isFinal) { interim += ' ' + text; continue; }
      if (!r.ptt && !wakeRe.test(fuzzyWake(text))) {
        for (let k = 1; k < res.length; k++) { const alt = res[k].transcript.trim(); if (wakeRe.test(fuzzyWake(alt))) { text = alt; break; } }
      }
      if (!text) continue;
      if (!r.ptt && stopRe.test(text) && (busy || speaking) && !isEcho(text)) { clearUtterance(); stopAll(); return; }
      // While Eve talks, anything that isn't addressed to her is just her own voice or background: drop it.
      if (!r.ptt && speaking && !wakeHit(text)) { heard = ''; continue; }
      heard = (heard + ' ' + text).trim();
    }
    heardInterim = interim.trim();
    if (!r.ptt && (busy || speaking) && bargeIn((heard + ' ' + heardInterim).trim())) return;
    if (heard || heardInterim) {
      armSilence();
      if (awaitingCommand) awaitingCommand = Math.max(awaitingCommand, Date.now() + SPEECH_PAUSE_MS + 1000); // don't time out mid-request
    }
    showPending();
  };
  r.onerror = (e) => {
    if (e.error === 'not-allowed') { addMsg('error', 'Microphone access was denied.'); wakeMode = false; updateButtons(); }
  };
  r.onend = () => {
    if (rec === r) rec = null;
    // Keep what was heard: Chrome/Edge end sessions on pauses, and unfinished interim words would be lost.
    if (heardInterim) { heard = (heard + ' ' + heardInterim).trim(); heardInterim = ''; }
    listening = false; render();
    if (r.ptt) { pushToTalk = false; flushUtterance(true); }
    else showPending();
    if (wakeMode && !paused && !rec) setTimeout(startRec, 250); // Chrome/Edge stop continuous mode periodically
  };
  try { r.start(); } catch { if (rec === r) rec = null; }
}

// Watchdog: the browser recognizer sometimes dies silently or goes deaf after a while, which is why
// Eve seemed not to hear her name. Restart it if it's gone, and refresh it when it has been idle a long time.
setInterval(() => {
  if (!SR || !wakeMode || paused || pushToTalk) return;
  if (!rec) return startRec();
  if (!rec.ptt && Date.now() - rec.t0 > 50000 && !heard && !heardInterim && !speaking && !busy && !awaitingCommand) rec.abort(); // onend restarts it
}, 3000);

// ---------- Endpointing: only act once the user has really stopped talking ----------
// Final and interim results accumulate in `heard` (across recognizer restarts), and the utterance
// is handled only after SPEECH_PAUSE_MS with no new speech. Any new result resets the timer.
const SPEECH_PAUSE_MS = CFG.speechPauseMs || 1800;
let heard = '', heardInterim = '', silenceTimer = null;
function armSilence() {
  clearTimeout(silenceTimer);
  // Just the name ("Eve"): answer quickly instead of waiting out the full pause.
  const t = normalizeSpeech(heard + ' ' + heardInterim);
  const nameOnly = !awaitingCommand && !(rec && rec.ptt) && wakeRe.test(t) && !(t.match(wakeRe)[1] || '').trim();
  silenceTimer = setTimeout(() => {
    silenceTimer = null;
    if (rec && rec.ptt) return rec.stop(); // its onend sends the text
    flushUtterance(false);
  }, nameOnly ? Math.min(700, SPEECH_PAUSE_MS) : SPEECH_PAUSE_MS);
}
function clearUtterance() { clearTimeout(silenceTimer); silenceTimer = null; heard = heardInterim = ''; showPending(); }
function showPending() { $('interim').textContent = (heard + ' ' + heardInterim).trim(); }
function flushUtterance(ptt) {
  const text = normalizeSpeech(heard + ' ' + heardInterim);
  clearUtterance();
  if (!text || (!ptt && isEcho(text))) return;
  if (ptt) send(text); else handleFinal(text);
}

// Light clean-up of common recognition noise: filler words, stutters ("open open"), a misheard wake word.
function normalizeSpeech(text) {
  return text
    .replace(/(^|\s)(?:um+|uh+|erm+|er|hmm+|mm+)[,.]?(?=\s|$)/gi, '$1')
    .trim()
    .replace(/\b([a-z']+)(?:[\s,]+\1\b)+/gi, '$1')
    .replace(/^[\s\S]*$/, fuzzyWake)
    .replace(new RegExp(`^((?:hey|ok|okay|uy|hoy)[\\s,]+)?(?:${wakeNames})\\b`, 'i'), (_, hey) => (hey || '') + CFG.wakeWord.charAt(0).toUpperCase() + CFG.wakeWord.slice(1))
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function handleFinal(text) {
  if (!text) return;
  if (answerByVoice(text)) return; // "yes"/"no" to a permission request needs no wake word
  if (stopRe.test(text) && (busy || speaking)) { stopAll(); return; }
  if (awaitingCommand > Date.now()) { awaitingCommand = 0; listening = false; render(); send(text); return; }
  const m = text.match(wakeRe);
  if (convoOpen()) {
    // In a conversation no wake word is needed. Her name may still lead the sentence.
    const lead = m ? text.slice(0, m.index).split(/\s+/).filter(Boolean).length <= 1 : false;
    const body = (m && lead ? m[1] : text).trim();
    if (!body) return acknowledgeWake();
    if (stopRe.test(text)) { convoUntil = 0; render(); return; }
    if (END_CONVO.test(body)) return endConvo();
    if (body.split(/\s+/).length < 2 && !SHORT_OK.test(body)) return; // stray word: TV, cough, background
    return send(body);
  }
  if (!m) return;
  if (m[1].trim()) send(m[1]);
  else acknowledgeWake();
}

function endConvo() {
  convoUntil = 0;
  const bye = ['Anytime, {honorific}.', "You're welcome, {honorific}.", 'Just call if you need me.'].map((r) => r.replaceAll('{honorific}', CFG.honorific));
  const reply = bye[Math.floor(Math.random() * bye.length)];
  addMsg('eve', reply);
  convoEnding = true;
  say(reply, () => { convoEnding = false; convoUntil = 0; render(); });
}

// Just "Hey Eve": answer out loud right away (no round trip to Claude), then listen for the request.
const COMMAND_WINDOW_MS = 10000;
function acknowledgeWake() {
  shutUp();
  const replies = (CFG.wakeReplies || ['Yes?']).map((r) => r.replaceAll('{honorific}', CFG.honorific));
  const reply = replies[Math.floor(Math.random() * replies.length)];
  addMsg('eve', reply);
  say(reply, () => {
    chime();
    awaitingCommand = Date.now() + COMMAND_WINDOW_MS;
    listening = true; render();
    setTimeout(() => { if (awaitingCommand && awaitingCommand <= Date.now()) { awaitingCommand = 0; listening = false; render(); } }, COMMAND_WINDOW_MS + 100);
  });
}

// ---------- Barge-in: interrupt Eve mid-sentence or mid-task ----------
// The mic stays on while she talks (set "bargeIn": false in config.json to mute it instead).
// Her own voice is filtered out by isEcho(); only her name or a stop phrase gets through.
const bargeStopRe = new RegExp(`(?:^|\\b(?:${wakeNames})\\b[\\s,.!?]*)(${STOP_WORDS}|wait|hold on|pause|enough|teka|sandali)\\b`, 'i');
const wakeHit = (text) => new RegExp(`\\b(?:${wakeNames})\\b`, 'i').test(text) && !isEcho(text);
let lastBarge = 0;
function bargeIn(text) {
  if (!text || isEcho(text)) return false;
  if (bargeStopRe.test(text) && (wakeHit(text) || stopRe.test(text))) { // "Eve, stop" / "stop" / "Eve, wait"
    clearUtterance();
    if (Date.now() - lastBarge < 1500) return true; // same utterance still streaming in
    lastBarge = Date.now();
    stopAll(); chime(520);
    return true;
  }
  if (speaking && wakeHit(text)) shutUp(); // "Eve…" while she talks: go quiet, and let the rest of the request come through
  return false;
}
function pauseRecognition() {
  if (CFG.bargeIn !== false) return;
  paused = true; if (rec && !rec.ptt) { clearUtterance(); rec.abort(); }
}
function resumeRecognition() { paused = false; if (wakeMode && !rec) startRec(); }

function talk() {
  if (!SR) return addMsg('error', 'Speech recognition is not supported in this browser. Use Edge or Chrome.');
  shutUp();
  if (rec) { const old = rec; rec = null; old.abort(); }
  pushToTalk = true; clearUtterance();
  chime();
  setTimeout(startRec, 80);
}

// ---------- Controls ----------
function updateButtons() {
  $('wakeBtn').setAttribute('aria-pressed', String(wakeMode));
  $('wakeLabel').textContent = wakeMode ? 'On' : 'Off';
  $('muteBtn').setAttribute('aria-pressed', String(voiceOn));
  $('muteBtn').title = `Spoken replies (${voiceOn ? 'on' : 'off'})`;
  render();
}
$('wakeBtn').onclick = () => {
  wakeMode = !wakeMode;
  if (wakeMode) startRec(); else if (rec) rec.abort();
  updateButtons();
};
$('muteBtn').onclick = () => { voiceOn = !voiceOn; if (!voiceOn) shutUp(); updateButtons(); };
$('stopBtn').onclick = stopAll;
$('reloadBtn').onclick = () => location.reload();
$('newBtn').onclick = () => { stopAll(); post('/api/reset'); };
// Auto mode: one click by the user is the consent; the server remembers it across restarts.
let autoOn = false;
function setAuto(on) {
  autoOn = !!on;
  $('autoBtn').setAttribute('aria-pressed', String(autoOn));
}
$('autoBtn').onclick = () => postJson('/api/auto', { on: !autoOn });
$('micBtn').onclick = talk;
$('reactor').onclick = talk;
$('reactor').onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); talk(); } };
// The mic button becomes a send button while there's text to send.
const syncComposer = () => { const has = !!$('input').value.trim(); $('sendBtn').hidden = !has; $('micBtn').hidden = has; };
$('input').addEventListener('input', syncComposer);
$('form').onsubmit = (e) => { e.preventDefault(); send($('input').value); $('input').value = ''; localStorage.removeItem('eveDraft'); syncComposer(); };
$('hints').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) send(b.textContent); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('histPanel').hidden) { closeHistory(); return; }
  if (e.key === 'Escape' && !$('settingsPanel').hidden) { closeSettings(); $('settingsBtn').focus(); return; }
  // Keep Tab inside the History dialog while it's open.
  if (e.key === 'Tab' && !$('histPanel').hidden) {
    const f = [$('histClose'), $('histList')], i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
  }
  if (e.key === 'Escape') stopAll();
  if (e.code === 'Space' && e.ctrlKey) { e.preventDefault(); talk(); }
  // "/" or Ctrl+K: jump to the text box from anywhere.
  if ((e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) || (e.key.toLowerCase() === 'k' && e.ctrlKey)) { e.preventDefault(); $('input').focus(); }
});
// Up arrow in an empty text box brings back the last request, to edit and resend.
$('input').addEventListener('keydown', (e) => {
  const last = lastAsked || localStorage.getItem('eveLast');
  if (e.key === 'ArrowUp' && !$('input').value && last) { e.preventDefault(); $('input').value = last; syncComposer(); }
});
// Unsent text survives reloads and restarts.
$('input').value = localStorage.getItem('eveDraft') || '';
syncComposer();
$('input').addEventListener('input', () => localStorage.setItem('eveDraft', $('input').value));

// After a reload, show where we left off: the last few exchanges since "Start a new chat".
(async () => {
  try {
    const { items } = await (await fetch('/api/history?current&n=6')).json();
    if (!items.length || log.querySelector('.past')) return;
    const els = [];
    for (const it of items.reverse()) {
      els.push(addMsg('user', it.user));
      const r = addMsg('eve', ''); renderReply(r, it.eve); els.push(r);
    }
    els.forEach((el) => el.classList.add('past'));
    const d = addMsg('system', 'Earlier conversation above');
    d.classList.add('divider');
    log.prepend(...els, d); // above anything said since the page loaded (e.g. the greeting)
    log.scrollTop = log.scrollHeight;
    if (!localStorage.getItem('eveLast')) localStorage.setItem('eveLast', items.at(-1).user);
  } catch { /* server not up yet: start empty */ }
})();

$('bootBtn').onclick = async () => {
  $('boot').remove();
  try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop()); } catch {}
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  wakeMode = !!SR;
  if (wakeMode) startRec();
  updateButtons();
  const h = new Date().getHours();
  const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const line = `${greet}, ${CFG.honorific}. All systems online.`;
  addMsg('eve', line + (SR ? ` Say "${CFG.wakeWord}" followed by your request.` : ''));
  say(line);
};
if (!SR) $('bootNote').textContent = 'Voice input needs Edge or Chrome. Text chat works everywhere.';
updateButtons();
// In Eve's own app window (opened with autoplay allowed) skip the click once the mic is already allowed.
if (new URLSearchParams(location.search).has('app') && navigator.permissions) {
  navigator.permissions.query({ name: 'microphone' })
    .then((p) => { if (p.state === 'granted' && $('boot')) $('bootBtn').click(); })
    .catch(() => {});
}

// Settings panel: model, voice, language, wake word and New chat live here to keep the top bar short.
$('settingsBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const open = $('settingsPanel').hidden;
  $('settingsPanel').hidden = !open;
  $('settingsBtn').setAttribute('aria-expanded', String(open));
});
function closeSettings() { $('settingsPanel').hidden = true; $('settingsBtn').setAttribute('aria-expanded', 'false'); }
// History: past exchanges from data/history.jsonl, newest first. Read-only; the transcript isn't replaced.
$('histBtn').onclick = async () => {
  closeSettings();
  const list = $('histList');
  list.textContent = 'Loading…';
  $('histPanel').hidden = false;
  $('histClose').focus();
  try {
    const { items } = await (await fetch('/api/history')).json();
    list.textContent = items.length ? '' : 'No past conversations yet.';
    for (const it of items) {
      const el = document.createElement('article');
      el.className = 'histitem';
      const when = document.createElement('time');
      when.textContent = new Date(it.ts).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
      const q = document.createElement('p'); q.className = 'q'; q.textContent = it.user;
      const a = document.createElement('p'); a.className = 'a'; a.textContent = it.eve;
      el.append(when, q, a);
      list.append(el);
    }
  } catch {
    list.textContent = "Couldn't load history. Is Eve's server running?";
  }
};
function closeHistory() { $('histPanel').hidden = true; $('settingsBtn').focus(); }
$('histClose').onclick = closeHistory;
document.addEventListener('click', (e) => {
  if (!$('settingsPanel').hidden && !e.target.closest('#settingsPanel, #settingsBtn')) closeSettings();
});
// Plain phrase for a tool call (the server normally sends ev.label); raw commands are never shown.
function friendlyTool(name = '') {
  const map = { Screenshot: 'Looking at your screen…', Read: 'Reading a file…', Write: 'Writing a file…', Edit: 'Editing a file…', Bash: 'Working on it…', Grep: 'Searching files…', Glob: 'Looking for files…', WebSearch: 'Searching the web…', WebFetch: 'Reading a web page…', Task: 'Asking a helper…', Agent: 'Asking a helper…', TodoWrite: 'Planning…' };
  return map[name] || (name.startsWith('mcp__') ? 'Using a connector…' : 'Working on it…');
}
</script>
