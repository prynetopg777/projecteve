<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E.V.E.</title>
<style>
  :root {
    --bg: #02050b;
    --bg2: #061224;
    --glass: rgba(12, 28, 48, .52);
    --glass-hi: rgba(20, 44, 72, .55);
    --line: rgba(90, 220, 255, .16);
    --line-hi: rgba(90, 230, 255, .42);
    --cyan: #38e8ff;
    --teal: #2dffc4;
    --cyan-dim: #2a8fb3;
    --text: #d9f1fb;
    --muted: #6f93a8;
    --amber: #ffb547;
    --violet: #b98cff;
    --red: #ff5a6a;
    --green: #7dffc0;
    --accent: var(--cyan);
    --radius: 18px;
    color-scheme: dark;
  }
  body[data-state="listening"] { --accent: var(--teal); }
  body[data-state="thinking"] { --accent: var(--amber); }
  body[data-state="speaking"] { --accent: var(--violet); }
  body[data-state="permission"] { --accent: var(--amber); }
  body[data-state="offline"] { --accent: var(--muted); }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(ellipse 80% 55% at 50% -10%, #0c2a48 0%, transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 110%, #062033 0%, transparent 70%),
      linear-gradient(180deg, var(--bg2), var(--bg)) fixed;
    color: var(--text);
    font: 14.5px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-rows: auto 1fr auto;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 14px;
    overflow: hidden;
  }
  /* Faint HUD grid + scanlines behind everything */
  body::before, body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; }
  body::before {
    background-image: linear-gradient(rgba(80, 210, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(80, 210, 255, .045) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 30%, #000 0%, transparent 75%);
    animation: drift 40s linear infinite;
  }
  body::after { background: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px); }
  @keyframes drift { to { background-position: 44px 44px, 44px 44px; } }

  ::selection { background: rgba(56, 232, 255, .3); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(90, 220, 255, .18); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px;
    margin-top: 12px; padding: 9px 12px 9px 16px;
    background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  .brand { display: flex; align-items: center; letter-spacing: .42em; font-weight: 600; font-size: 13px; color: var(--cyan); text-shadow: 0 0 12px rgba(56, 232, 255, .65); }
  .brand::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; margin-right: 12px;
    background: var(--accent); box-shadow: 0 0 10px var(--accent), 0 0 3px var(--accent);
    animation: blink 2.4s ease-in-out infinite; transition: background .4s, box-shadow .4s;
  }
  @keyframes blink { 50% { opacity: .35; } }
  .model { margin-left: 4px; font-size: 9.5px; letter-spacing: .18em; color: var(--muted); text-shadow: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; text-transform: uppercase; font-weight: 500; }
  .model:empty { display: none; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }

  button {
    font: inherit; font-size: 12.5px; color: var(--text); cursor: pointer;
    background: rgba(10, 26, 44, .6); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px;
    transition: border-color .2s, color .2s, background .2s, box-shadow .2s, transform .1s;
  }
  button:hover { border-color: var(--line-hi); background: var(--glass-hi); box-shadow: 0 0 14px rgba(56, 232, 255, .15); }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
  button.on { border-color: rgba(56, 232, 255, .65); color: var(--cyan); background: rgba(56, 232, 255, .09); box-shadow: 0 0 12px rgba(56, 232, 255, .22), inset 0 0 10px rgba(56, 232, 255, .08); }

  main { display: flex; flex-direction: column; min-height: 0; gap: 10px; padding-top: 6px; }

  /* Orb */
  .stage { display: flex; flex-direction: column; align-items: center; flex: none; position: relative; }
  .reactor {
    position: relative; width: clamp(150px, 30vh, 250px); aspect-ratio: 1; cursor: pointer;
    border-radius: 50%; transition: transform .25s;
  }
  .reactor:hover { transform: scale(1.025); }
  .reactor canvas { position: absolute; inset: -14%; width: 128%; height: 128%; }
  /* HUD corner brackets */
  .reactor::before, .reactor::after {
    content: ""; position: absolute; inset: -6%; pointer-events: none; opacity: .5;
    border: 1px solid var(--accent); transition: border-color .5s;
    -webkit-mask: linear-gradient(#000 0 0) top left / 16% 16% no-repeat, linear-gradient(#000 0 0) top right / 16% 16% no-repeat,
                  linear-gradient(#000 0 0) bottom left / 16% 16% no-repeat, linear-gradient(#000 0 0) bottom right / 16% 16% no-repeat;
  }
  .reactor::after { inset: -9%; opacity: .18; border-radius: 50%; border-style: dashed; -webkit-mask: none; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wave { width: min(420px, 92%); height: 40px; display: block; margin-top: 4px; }
  .state {
    margin-top: 2px; font-size: 11px; letter-spacing: .38em; text-transform: uppercase; min-height: 18px;
    color: var(--accent); text-shadow: 0 0 10px var(--accent); transition: color .4s; padding-left: .38em;
  }
  body[data-state="idle"] .state { color: var(--muted); text-shadow: none; }
  body[data-state="permission"] .state, body[data-state="offline"] .state { animation: blink 1s ease-in-out infinite; }
  .interim { font-style: italic; color: var(--teal); opacity: .85; min-height: 22px; text-align: center; padding: 0 12px; font-size: 14px; }

  /* Transcript panel */
  .panel {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .04);
    overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex: none;
    font-size: 10px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  .panel-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-hi), transparent); }
  .log {
    flex: 1; overflow-y: auto; min-height: 0; padding: 12px 14px 16px;
    display: flex; flex-direction: column; gap: 10px;
    mask-image: linear-gradient(to bottom, transparent 0, #000 18px);
  }
  .log > * { animation: rise .35s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .msg { max-width: 86%; padding: 9px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user {
    align-self: flex-end; border-bottom-right-radius: 4px;
    background: linear-gradient(135deg, rgba(56, 232, 255, .16), rgba(45, 255, 196, .08));
    border: 1px solid rgba(56, 232, 255, .3);
  }
  .msg.eve {
    align-self: flex-start; border-bottom-left-radius: 4px; position: relative;
    background: rgba(8, 20, 36, .7); border: 1px solid var(--line);
    box-shadow: inset 2px 0 0 rgba(56, 232, 255, .55);
  }
  .msg.reminder { align-self: center; color: var(--amber); border: 1px solid rgba(255,181,71,.4); background: rgba(255,181,71,.08); box-shadow: 0 0 18px rgba(255,181,71,.12); }
  .msg.error { align-self: center; color: var(--red); border: 1px solid rgba(255,90,106,.4); background: rgba(255,90,106,.06); font-size: 13px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line); }
  .tool { align-self: flex-start; font: 11.5px/1.4 "Cascadia Code", Consolas, monospace; color: var(--muted); padding-left: 6px; overflow-wrap: anywhere; opacity: .85; }
  .tool::before { content: "⚙ "; color: var(--cyan-dim); }

  /* Permission request card */
  .perm {
    align-self: stretch; border: 1px solid rgba(255,181,71,.5); background: rgba(255,181,71,.06); border-radius: 14px; padding: 10px 14px;
    box-shadow: 0 0 22px rgba(255,181,71,.12), inset 0 0 18px rgba(255,181,71,.04);
  }
  .perm-title { color: var(--amber); font-weight: 600; }
  .perm pre { max-height: 180px; }
  .perm-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .perm-actions .allow, .perm-actions .always { border-color: rgba(92,255,176,.5); color: var(--green); }
  .perm-actions .allow:hover, .perm-actions .always:hover { box-shadow: 0 0 14px rgba(92,255,176,.25); }
  .perm-actions .deny { border-color: rgba(255,90,106,.5); color: var(--red); }
  .perm-actions .deny:hover { box-shadow: 0 0 14px rgba(255,90,106,.25); }
  .perm-hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .perm.task pre { white-space: pre-wrap; font-family: inherit; font-size: 13.5px; color: var(--text); }
  .taskchip { margin-left: 8px; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--green, #5cffb0); border: 1px solid rgba(92,255,176,.45); border-radius: 999px; padding: 2px 8px; cursor: help; animation: blink 2s ease-in-out infinite; }
  .taskchip[hidden] { display: none; }
  button.auto-on { border-color: var(--amber, #ffb547); color: var(--amber, #ffb547); background: rgba(255,181,71,.10); box-shadow: 0 0 14px rgba(255,181,71,.25); }
  .perm.done { opacity: .55; box-shadow: none; }
  .perm-result { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .banner {
    display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; padding: 8px 12px; font-size: 13px;
    border: 1px solid var(--line-hi); border-radius: 12px; background: rgba(56, 232, 255, .07); box-shadow: 0 0 18px rgba(56, 232, 255, .12);
  }
  .banner[hidden] { display: none; }
  pre { background: rgba(1, 4, 9, .85); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre; font: 12.5px/1.5 "Cascadia Code", Consolas, monospace; margin: 6px 0; color: #bfe9f7; }

  /* Input */
  form { display: flex; gap: 8px; padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px)); }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; color: var(--text);
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 11px 18px; outline: none;
    backdrop-filter: blur(14px); transition: border-color .2s, box-shadow .2s;
  }
  input[type=text]::placeholder { color: var(--muted); }
  input[type=text]:focus { border-color: var(--line-hi); box-shadow: 0 0 0 3px rgba(56, 232, 255, .08), 0 0 18px rgba(56, 232, 255, .12); }
  .mic {
    width: 46px; height: 46px; padding: 0; display: grid; place-items: center; flex: none;
    color: var(--cyan); border-color: rgba(56, 232, 255, .4);
    background: radial-gradient(circle, rgba(56, 232, 255, .16), rgba(10, 26, 44, .6) 70%);
  }
  .mic svg { width: 20px; height: 20px; fill: currentColor; }
  body[data-state="listening"] .mic { color: var(--teal); border-color: var(--teal); box-shadow: 0 0 0 0 rgba(45, 255, 196, .5); animation: ring 1.4s ease-out infinite; }
  @keyframes ring { to { box-shadow: 0 0 0 12px rgba(45, 255, 196, 0); } }

  /* Boot overlay (browsers need a click before audio/mic) */
  .boot {
    position: fixed; inset: 0; display: grid; place-items: center; z-index: 10;
    background: radial-gradient(circle at 50% 45%, rgba(8, 30, 52, .9), rgba(1, 3, 8, .97) 70%);
    backdrop-filter: blur(6px);
  }
  .boot > div { display: flex; flex-direction: column; align-items: center; }
  .boot-orb {
    width: 120px; height: 120px; border-radius: 50%; margin-bottom: 30px; position: relative;
    background: radial-gradient(circle, #eafcff 0%, var(--cyan) 22%, rgba(56, 232, 255, .15) 55%, transparent 70%);
    box-shadow: 0 0 60px rgba(56, 232, 255, .35); animation: breathe 3s ease-in-out infinite;
  }
  .boot-orb::before { content: ""; position: absolute; inset: -18px; border-radius: 50%; border: 1px solid rgba(56, 232, 255, .35); border-top-color: transparent; border-bottom-color: transparent; animation: spin 6s linear infinite; }
  @keyframes breathe { 50% { transform: scale(1.08); box-shadow: 0 0 90px rgba(56, 232, 255, .5); } }
  .boot button {
    font-size: 14px; padding: 13px 34px; letter-spacing: .3em; border-color: var(--cyan); color: var(--cyan);
    background: rgba(56, 232, 255, .06); box-shadow: 0 0 24px rgba(56, 232, 255, .25), inset 0 0 14px rgba(56, 232, 255, .1);
  }
  .boot button:hover { background: rgba(56, 232, 255, .14); box-shadow: 0 0 34px rgba(56, 232, 255, .45), inset 0 0 14px rgba(56, 232, 255, .15); }
  .boot p { color: var(--muted); text-align: center; font-size: 13px; margin-top: 16px; }

  /* Wide windows: orb on the left, transcript on the right */
  @media (min-width: 860px) and (min-height: 520px) {
    body { max-width: 1180px; }
    main { display: grid; grid-template-columns: minmax(300px, 1fr) 1.25fr; grid-template-rows: auto 1fr; gap: 14px; }
    .banner { grid-column: 1 / -1; }
    .stage { grid-column: 1; grid-row: 2; justify-content: center; }
    .reactor { width: clamp(200px, 42vh, 320px); }
    .panel { grid-column: 2; grid-row: 2; }
    form { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
  }
</style>
</head>
<body data-state="idle">
  <div class="boot" id="boot">
    <div>
      <div class="boot-orb"></div>
      <button id="bootBtn">INITIALIZE E.V.E.</button>
      <p id="bootNote">Allow microphone access when asked.</p>
    </div>
  </div>

  <header>
    <div class="brand">E.V.E.<span class="model" id="model" title="Claude model Eve is currently using"></span><span class="taskchip" id="taskChip" hidden>● Working on approved plan</span></div>
    <div class="controls">
      <button id="wakeBtn" title="Listen continuously for the wake word">Wake word</button>
      <button id="muteBtn" title="Turn spoken replies on/off">Voice on</button>
      <button id="autoBtn" title="Auto mode: Eve acts without asking permission (risky actions like shutdown still ask)">Auto: off</button>
      <button id="stopBtn" title="Interrupt (Esc)">Stop</button>
      <button id="newBtn" title="Start a fresh conversation (memory is kept)">New chat</button>
    </div>
  </header>

  <main>
    <div class="banner" id="banner" hidden>Eve updated her interface. <button id="reloadBtn">Reload</button></div>
    <div class="stage">
      <div class="reactor" id="reactor" title="Click to talk"><canvas id="orb"></canvas></div>
      <canvas class="wave" id="wave"></canvas>
      <div class="state" id="state">standby</div>
      <div class="interim" id="interim"></div>
    </div>
    <section class="panel">
      <div class="panel-head">Transcript</div>
      <div class="log" id="log"></div>
    </section>
  </main>

  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Type a message or click the mic…">
    <button type="button" class="mic" id="micBtn" title="Push to talk (Ctrl+Space)">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>
    </button>
  </form>

<script>
// ---------- Visuals: animated orb + waveform (purely cosmetic; reads body[data-state]) ----------
const fx = (() => {
  const palette = { // r, g, b, energy, spin speed
    idle:       [56, 232, 255, .10, .25],
    listening:  [45, 255, 196, .45, .6],
    thinking:   [255, 181, 71, .30, 2.4],
    speaking:   [185, 140, 255, .60, .9],
    permission: [255, 170, 60, .40, .5],
    offline:    [111, 142, 163, .03, .08],
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const orb = document.getElementById('orb'), wave = document.getElementById('wave');
  const oc = orb.getContext('2d'), wc = wave.getContext('2d');
  const cur = [...palette.idle];
  let boost = 0, t = 0, last = performance.now();
  // Live microphone level while actively listening (released as soon as listening stops).
  let analyser = null, samples = null, micStream = null, micToken = 0, micWanted = false;
  function listen(on) {
    if (on === micWanted) return;
    micWanted = on;
    const token = ++micToken;
    micStream?.getTracks().forEach((tr) => tr.stop());
    micStream = analyser = null;
    if (!on || !navigator.mediaDevices) return;
    navigator.mediaDevices.getUserMedia({ audio: true }).then((s) => {
      if (token !== micToken) return s.getTracks().forEach((tr) => tr.stop());
      const ctx = audioCtx();
      micStream = s; analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
      samples = new Float32Array(analyser.fftSize);
      ctx.createMediaStreamSource(s).connect(analyser);
    }).catch(() => {});
  }
  function micLevel() {
    if (!analyser) return -1;
    analyser.getFloatTimeDomainData(samples);
    let sum = 0;
    for (const v of samples) sum += v * v;
    return Math.min(1, Math.sqrt(sum / samples.length) * 7);
  }
  const sparks = Array.from({ length: 36 }, () => ({ a: Math.random() * 6.28, r: .55 + Math.random() * .4, s: .3 + Math.random() * .9, z: Math.random() }));

  function fit(c) {
    const dpr = Math.min(devicePixelRatio || 1, 2), w = c.clientWidth * dpr, h = c.clientHeight * dpr;
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  }
  const rgba = (a) => `rgba(${cur[0] | 0},${cur[1] | 0},${cur[2] | 0},${a})`;

  function drawOrb(state) {
    fit(orb);
    const W = orb.width, H = orb.height, cx = W / 2, cy = H / 2, R = Math.min(W, H) * .39 / 1.28 * 1.28 * .82;
    const e = cur[3] + boost;
    oc.clearRect(0, 0, W, H);
    oc.globalCompositeOperation = 'lighter';

    // Outer glow
    let g = oc.createRadialGradient(cx, cy, R * .2, cx, cy, R * 1.6);
    g.addColorStop(0, rgba(.28 + e * .25)); g.addColorStop(.45, rgba(.08 + e * .08)); g.addColorStop(1, rgba(0));
    oc.fillStyle = g; oc.fillRect(0, 0, W, H);

    // Rotating segmented rings
    oc.lineCap = 'round';
    [[1.18, 1, 3, 1.6], [1.05, -1.6, 5, 1], [.93, 2.3, 2, 2.2]].forEach(([k, dir, segs, lw], i) => {
      const rot = t * cur[4] * dir * .6 + i;
      oc.strokeStyle = rgba(.55 - i * .1); oc.lineWidth = lw * (W / 300);
      oc.shadowColor = rgba(.9); oc.shadowBlur = 10 * (W / 300);
      for (let s = 0; s < segs; s++) {
        const a0 = rot + (s / segs) * Math.PI * 2, len = (Math.PI * 2 / segs) * (.55 + .2 * Math.sin(t * .8 + s + i));
        oc.beginPath(); oc.arc(cx, cy, R * k, a0, a0 + len); oc.stroke();
      }
    });
    oc.shadowBlur = 0;

    // Tick marks on the outer ring
    oc.strokeStyle = rgba(.25); oc.lineWidth = W / 400;
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * Math.PI * 2 - t * .05, r0 = R * 1.28, r1 = R * (i % 6 ? 1.31 : 1.35);
      oc.beginPath(); oc.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); oc.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); oc.stroke();
    }

    // Orbiting sparks (dense and fast while thinking)
    const sparkAlpha = state === 'thinking' ? .9 : state === 'idle' ? .25 : .5;
    for (const p of sparks) {
      p.a += .004 * p.s * cur[4] * 3;
      const rr = R * (p.r + .08 * Math.sin(t * p.s + p.z * 6)), x = cx + Math.cos(p.a) * rr, y = cy + Math.sin(p.a) * rr * (.9 + .1 * p.z);
      oc.fillStyle = rgba(sparkAlpha * (.4 + .6 * p.z)); oc.beginPath(); oc.arc(x, y, (1 + p.z * 1.6) * (W / 300), 0, 7); oc.fill();
    }

    // Liquid core: a circle deformed by layered sines; amplitude follows energy
    const coreR = R * (.52 + e * .1), pts = 96;
    for (let layer = 0; layer < 3; layer++) {
      oc.beginPath();
      for (let i = 0; i <= pts; i++) {
        const a = (i / pts) * Math.PI * 2;
        const d = Math.sin(a * 3 + t * 1.7 + layer) * .5 + Math.sin(a * 5 - t * 2.3 + layer * 2) * .3 + Math.sin(a * 2 + t * .9) * .2;
        const r = coreR * (1 - layer * .14) * (1 + d * e * .22);
        const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        i ? oc.lineTo(x, y) : oc.moveTo(x, y);
      }
      g = oc.createRadialGradient(cx, cy - coreR * .2, 0, cx, cy, coreR * 1.1);
      g.addColorStop(0, `rgba(240,253,255,${.55 - layer * .12})`); g.addColorStop(.35, rgba(.5 - layer * .1)); g.addColorStop(1, rgba(.04));
      oc.fillStyle = g; oc.fill();
    }
    oc.globalCompositeOperation = 'source-over';
  }

  function drawWave(state) {
    fit(wave);
    const W = wave.width, H = wave.height, mid = H / 2, e = cur[3] + boost;
    wc.clearRect(0, 0, W, H);
    wc.globalCompositeOperation = 'lighter';
    if (analyser) { // real microphone signal (samples were just read by micLevel)
      wc.beginPath();
      for (let x = 0; x <= W; x += 2) {
        const u = x / W, env = Math.sin(u * Math.PI) ** 2;
        const y = mid + env * H * 1.6 * samples[Math.floor(u * (samples.length - 1))];
        x ? wc.lineTo(x, y) : wc.moveTo(x, y);

      wc.strokeStyle = rgba(.95); wc.lineWidth = 2 * Math.min(devicePixelRatio || 1, 2);
      wc.shadowColor = rgba(1); wc.shadowBlur = 10; wc.stroke();
    }
    [[1, .9, 2], [.6, .45, 1.2], [.35, .25, 1]].slice(analyser ? 1 : 0).forEach(([amp, alpha, lw], k) => {
      wc.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const u = x / W, env = Math.sin(u * Math.PI) ** 2; // fade out at both ends
        const y = mid + env * H * .42 * amp * Math.min(1, e * 1.3) *
          (Math.sin(u * 18 + t * (3 + k) + k) * .6 + Math.sin(u * 41 - t * 5.3 + k * 2) * .3 + Math.sin(u * 7 + t * 1.3) * .4);
        x ? wc.lineTo(x, y) : wc.moveTo(x, y);

    const level = micLevel();
    if (level >= 0) boost += (level * .6 - boost) * Math.min(1, dt * 14); // orb pulses with your voice
    else {
      if (state === 'speaking' || state === 'listening') boost += (Math.random() - .5) * .04;

function audioCtx() {

  if (ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}

<script>
// ---------- App logic: speech, server connection, permissions ----------
const CFG = /*CONFIG*/;
const $ = (id) => document.getElementById(id);
const log = $('log');

// ---------- UI helpers ----------
let busy = false, speaking = false, listening = false, offline = false, reportedState = null;
const perms = new Map(); // pending permission id -> card element
function render() {
  const base = speaking ? 'speaking' : listening ? 'listening' : busy ? 'thinking' : 'idle';
  const state = offline ? 'offline' : perms.size ? 'permission' : base;
  document.body.dataset.state = state;
  fx.listen(base === 'listening');
  $('state').textContent = { idle: wakeMode ? `say "${CFG.wakeWord}"` : 'standby', listening: 'listening', thinking: 'processing', speaking: 'speaking', permission: 'awaiting your ok', offline: 'reconnecting' }[state];
  // Tell the server (and through it, the desktop overlay) what we're doing.
  if (base !== reportedState) { reportedState = base; postJson('/api/ui-state', { state: base }).catch(() => {}); }
}
function addMsg(cls, text) {
  const el = document.createElement('div');
  el.className = cls === 'tool' ? 'tool' : `msg ${cls}`;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
// Minimal markdown: fenced code blocks become <pre>, everything else stays plain text.
function renderReply(el, text) {
  el.replaceChildren();
  text.split(/(```[\s\S]*?(?:```|$))/).forEach((part) => {
    if (part.startsWith('```')) {
      const pre = document.createElement('pre');
      pre.textContent = part.replace(/^```[^\n]*\n?/, '').replace(/```$/, '');
      el.append(pre);

}

// ---------- Text to speech ----------
let voiceOn = true, voice = null, voiceFil = null;
// Tagalog or Taglish? Count common Filipino function words.
const FIL_WORDS = /\b(ang|ng|mga|sa|na|po|opo|ko|mo|niya|ito|yung|naman|lang|ba|hindi|wala|meron|kasi|talaga|sige|ikaw|ako|siya|natin|kayo|pala|din|rin)\b/gi;

function pickVoice() {
  const voices = speechSynthesis.getVoices();
  const want = (CFG.voice || '').toLowerCase();
  voice = (want && voices.find((v) => v.name.toLowerCase().includes(want)))
    || voices.find((v) => /Natural/i.test(v.name) && /en-GB/i.test(v.lang) && /Sonia|Libby|Maisie|Hollie|Bella/i.test(v.name))
    || voices.find((v) => /Natural/i.test(v.name) && /^en/i.test(v.lang) && /Aria|Jenny|Ava|Emma|Michelle|Natasha/i.test(v.name))
    || voices.find((v) => /^en/i.test(v.lang) && /Hazel|Susan|Zira|Samantha|Serena|Kate|Female/i.test(v.name))
    || voices.find((v) => /^en/i.test(v.lang)) || null;
  // Filipino replies use a Filipino voice (Edge: "Blessica Online (Natural)") when one is installed.
  voiceFil = voices.find((v) => /^(fil|tl)/i.test(v.lang) && /Natural/i.test(v.name) && /Blessica|Female/i.test(v.name))
    || voices.find((v) => /^(fil|tl)/i.test(v.lang)) || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

let ttsPending = 0;
// What Eve said recently, so the mic (which stays on while she talks) can ignore her own voice.
let recentSpeech = [];
const normWords = (s) => s.toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
function isEcho(text) {
  const n = normWords(text);

  return n.length > 2 && recentSpeech.some((s) => s.text.includes(n));
}
function say(text, onEnd) {

  const u = new SpeechSynthesisUtterance(text);
  const v = voiceFil && isFilipino(text) ? voiceFil : voice;

// Turn reply markdown into speakable text. Unclosed code fences cut off the text (rest isn't final yet).
function speakable(text) {
  let t = text.replace(/```[\s\S]*?```/g, ' ');
  const open = t.indexOf('```');
  if (open !== -1) t = t.slice(0, open);
  return t.replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/https?:\/\/\S+/g, 'the link')

}

// ---------- Streaming reply ----------
let replyEl = null, replyText = '', spokenLen = 0;
function onDelta(text) {

    if (!text) return;
    replyEl = addMsg('eve', ''); replyText = ''; spokenLen = 0;
  }
  replyText += text;
  fx.kick(.12);
  renderReply(replyEl, replyText);
  // Speak each finished sentence as soon as it arrives.
  const clean = speakable(replyText);
  const m = clean.slice(spokenLen).match(/^[\s\S]*[.!?:;](?=\s)|^[\s\S]*\n/);

}

const events = new EventSource('/events');

events.onerror = () => { offline = true; render(); }; // the browser retries by itself

  const ev = JSON.parse(e.data);
  switch (ev.type) {
    case 'hello':

      ev.pending.forEach(showPermission);
      render();
      break;
    case 'model': setModel(ev.model); break;
    case 'auto':
      if (ev.on !== autoOn) addMsg('system', ev.on ? '⚡ Auto mode on. Eve will act without asking (shutdowns, disk wipes and similar still ask).' : '🔐 Auto mode off. Eve will ask before acting again.');
      setAuto(ev.on);
      break;
    case 'task': setTask(ev.task); if (!ev.task && ev.reason === 'done') addMsg('system', '✓ Task finished. Normal permission prompts are back.'); break;
    case 'permission': showPermission(ev); break;
    case 'permission-resolved': resolvePermission(ev.id, ev.decision); break;
    case 'refreshed': replyEl = null; addMsg('system', '🧹 Context refreshed to stay fast. Memory intact.'); break;
    case 'restarting': replyEl = null; addMsg('system', '♻ Restarting to load my updates. Back in a moment.'); break;
    case 'busy': busy = ev.busy; render(); break;
    case 'user': if (ev.text !== lastSent) addMsg('user', ev.text); lastSent = null; break;
    case 'delta': onDelta(ev.text); break;
    case 'tool': replyEl = null; addMsg('tool', `${ev.sub ? '↳ ' : ''}${ev.name}${ev.detail ? ': ' + ev.detail : ''}`); break;
    case 'done': onDone(); break;
    case 'error': replyEl = null; addMsg('error', ev.message); chime(220); break;
    case 'reminder':
      addMsg('reminder', `⏰ ${ev.text}`); chime(660); setTimeout(() => chime(990), 180);
      say(`Pardon the interruption, ${CFG.honorific}. Reminder: ${ev.text}`);
      if (Notification.permission === 'granted') new Notification('EVE reminder', { body: ev.text });
      break;
    case 'reset': log.replaceChildren(); addMsg('eve', 'Fresh conversation. My long-term memory is intact.'); break;
  }
};

function setModel(m) { $('model').textContent = m || ''; }
// While an approved plan is running, show it in the header (hover for the full plan).
function setTask(task) {
  const chip = $('taskChip');
  chip.hidden = !task;
  if (task) chip.title = `Approved plan (until ${new Date(task.until).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}):\n${task.plan}\n\nPress Stop to withdraw approval.`;
}

// ---------- Permission requests ----------
function showPermission(req) {
  if (perms.has(req.id)) return;
  replyEl = null;
  const el = document.createElement('div');
  el.className = 'perm';
  const title = document.createElement('div');
  title.className = 'perm-title';
  title.textContent = `🔐 May I ${req.title}?`;
  el.append(title);
  if (req.detail) { const pre = document.createElement('pre'); pre.textContent = req.detail; el.append(pre); }
  const row = document.createElement('div');
  row.className = 'perm-actions';
  const isTask = req.kind === 'task';
  if (isTask) { el.classList.add('task'); title.textContent = '🔐 May I go ahead with this plan? I won\'t ask again until it\'s done.'; }
  const choices = isTask ? [['Approve plan', 'allow'], ['Deny', 'deny']] : [['Allow', 'allow'], ['Allow for this session', 'always'], ['Deny', 'deny']];
  for (const [label, decision] of choices) {
    const b = document.createElement('button');
    b.textContent = label; b.className = decision;
    b.onclick = () => answerPermission(req.id, decision);
    row.append(b);
  }
  const hint = document.createElement('div');
  hint.className = 'perm-hint';
  hint.textContent = 'Or just say "yes" or "no".';
  el.append(row, hint);
  log.append(el);
  log.scrollTop = log.scrollHeight;
  perms.set(req.id, el);
  render();
  chime(740);
  const hon = CFG.honorific.charAt(0).toUpperCase() + CFG.honorific.slice(1);
  say(isTask ? `${hon}, shall I go ahead with the plan? Just say yes and I'll handle the rest.` : `${hon}, may I ${req.title}?`);

}
function resolvePermission(id, decision) {
  const el = perms.get(id);
  if (!el) return;
  perms.delete(id);
  el.classList.add('done');
  el.querySelector('.perm-hint')?.remove();
  const result = document.createElement('div');
  result.className = 'perm-result';
  const labels = el.dataset.kind === 'task'
    ? { allow: '✓ Plan approved. Eve will handle the rest.', deny: '✕ Plan declined', cancelled: '— Cancelled' }
    : { allow: '✓ Allowed', always: '✓ Allowed for this session', deny: '✕ Denied', cancelled: '— Cancelled' };
  result.textContent = labels[decision] || decision;
  el.querySelector('.perm-actions').replaceWith(result);
  render();
}
function answerPermission(id, decision) { postJson('/api/permission', { id, decision }); }
// Spoken/typed "yes"/"no" answers the oldest pending request. Returns true if it was an answer.
const yesRe = /^(yes|yeah|yep|yup|sure|go ahead|do it|allow( it)?|okay|ok|please do|please|approved?|affirmative|of course|oo|opo|sige)\b/i;
const noRe = /^(no|nope|don'?t|deny|denied|decline|cancel|negative|not now|hindi|huwag|wag|ayoko)\b/i;
function answerByVoice(text) {
  if (!perms.size) return false;
  const t = text.replace(new RegExp(`^(?:hey )?(?:${wakeNames})[\\s,.!?]*`, 'i'), '').trim();
  const id = perms.keys().next().value;
  if (yesRe.test(t)) { answerPermission(id, 'allow'); return true; }
  if (noRe.test(t)) { answerPermission(id, 'deny'); return true; }
  return false;
}

let lastSent = null;
async function send(text) {
  text = text.trim();
  if (!text) return;
  if (answerByVoice(text)) return;
  shutUp();
  lastSent = text;
  addMsg('user', text);
  // A new request while Eve is still working replaces the old one instead of queueing behind it.
  const interrupt = busy;
  if (interrupt) replyEl = null;
  const r = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, interrupt }) });
  if (!r.ok) addMsg('error', `Request failed (${r.status})`);
}
function postJson(path, body = {}) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}
const post = (path) => postJson(path);
function stopAll() { shutUp(); post('/api/stop'); replyEl = null; }

// ---------- Speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, wakeMode = false, pushToTalk = false, awaitingCommand = 0, paused = false;
const wakeNames = [CFG.wakeWord, ...(CFG.wakeAliases || [])].join('|');
const wakeRe = new RegExp(`\\b(?:hey |ok |okay |uy |hoy )?(?:${wakeNames})\\b[\\s,.!?]*(.*)`, 'i');
// English and Filipino stop words: "stop", "tama na", "tigil"…
const STOP_WORDS = 'stop|cancel|never ?mind|shut up|be quiet|tama na|tigil|hinto|(?:hu)?wag na|ayoko na';

// so aborting one and starting another can't race.
function startRec() {

  r.ptt = pushToTalk;
  r.lang = CFG.speechLang || navigator.language || 'en-US'; // fil-PH also understands English and Taglish
  r.continuous = true; // push-to-talk too: the silence timer decides when you're done, not the browser

    listening = r.ptt || awaitingCommand > Date.now(); render();
    if (r.ptt) setTimeout(() => { if (rec === r && !heard && !heardInterim) r.stop(); }, 8000); // nothing said
  };
  r.onresult = (e) => {
    if (rec !== r) return;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i], text = res[0].transcript.trim();
      if (!res.isFinal) { interim += ' ' + text; continue; }
      if (!text) continue;
      if (!r.ptt && stopRe.test(text) && (busy || speaking) && !isEcho(text)) { clearUtterance(); stopAll(); return; }
      // While Eve talks, anything that isn't addressed to her is just her own voice or background: drop it.
      if (!r.ptt && speaking && !wakeHit(text)) { heard = ''; continue; }
      heard = (heard + ' ' + text).trim();
    }
    heardInterim = interim.trim();
    if (!r.ptt && (busy || speaking) && bargeIn((heard + ' ' + heardInterim).trim())) return;

// ---------- Endpointing: only act once the user has really stopped talking ----------
// Final and interim results accumulate in `heard` (across recognizer restarts), and the utterance

const SPEECH_PAUSE_MS = CFG.speechPauseMs || 1800;

  clearTimeout(silenceTimer);

    silenceTimer = null;

}
function clearUtterance() { clearTimeout(silenceTimer); silenceTimer = null; heard = heardInterim = ''; showPending(); }
function showPending() { $('interim').textContent = (heard + ' ' + heardInterim).trim(); }
function flushUtterance(ptt) {
  const text = normalizeSpeech(heard + ' ' + heardInterim);
  clearUtterance();

// Light clean-up of common recognition noise: filler words, stutters ("open open"), a misheard wake word.
function normalizeSpeech(text) {
  return text
    .replace(/(^|\s)(?:um+|uh+|erm+|er|hmm+|mm+)[,.]?(?=\s|$)/gi, '$1')
    .trim()
    .replace(/\b([a-z']+)(?:[\s,]+\1\b)+/gi, '$1')
    .replace(new RegExp(`^((?:hey|ok|okay|uy|hoy)[\\s,]+)?(?:${wakeNames})\\b`, 'i'), (_, hey) => (hey || '') + CFG.wakeWord.charAt(0).toUpperCase() + CFG.wakeWord.slice(1))
    .replace(/\s{2,}/g, ' ')
    .trim();
}

function handleFinal(text) {
  if (!text) return;
  if (answerByVoice(text)) return; // "yes"/"no" to a permission request needs no wake word
  if (stopRe.test(text) && (busy || speaking)) { stopAll(); return; }
  if (awaitingCommand > Date.now()) { awaitingCommand = 0; listening = false; render(); send(text); return; }
  const m = text.match(wakeRe);
  if (!m) return;
  if (m[1].trim()) send(m[1]);
  else acknowledgeWake();
}

// Just "Hey Eve": answer out loud right away (no round trip to Claude), then listen for the request.
const COMMAND_WINDOW_MS = 10000;
function acknowledgeWake() {
  shutUp();
  const replies = (CFG.wakeReplies || ['Yes?']).map((r) => r.replaceAll('{honorific}', CFG.honorific));
  const reply = replies[Math.floor(Math.random() * replies.length)];
  addMsg('eve', reply);
  say(reply, () => {
    chime();
    awaitingCommand = Date.now() + COMMAND_WINDOW_MS;
    listening = true; render();
    setTimeout(() => { if (awaitingCommand && awaitingCommand <= Date.now()) { awaitingCommand = 0; listening = false; render(); } }, COMMAND_WINDOW_MS + 100);
  });
}

// ---------- Barge-in: interrupt Eve mid-sentence or mid-task ----------
// The mic stays on while she talks (set "bargeIn": false in config.json to mute it instead).
// Her own voice is filtered out by isEcho(); only her name or a stop phrase gets through.
const bargeStopRe = new RegExp(`(?:^|\\b(?:${wakeNames})\\b[\\s,.!?]*)(${STOP_WORDS}|wait|hold on|pause|enough|teka|sandali)\\b`, 'i');
const wakeHit = (text) => new RegExp(`\\b(?:${wakeNames})\\b`, 'i').test(text) && !isEcho(text);
let lastBarge = 0;
function bargeIn(text) {
  if (!text || isEcho(text)) return false;
  if (bargeStopRe.test(text) && (wakeHit(text) || stopRe.test(text))) { // "Eve, stop" / "stop" / "Eve, wait"
    clearUtterance();

    lastBarge = Date.now();

  return false;
}
function pauseRecognition() {
  if (CFG.bargeIn !== false) return;

}
function resumeRecognition() { paused = false; if (wakeMode && !rec) startRec(); }

function talk() {
  if (!SR) return addMsg('error', 'Speech recognition is not supported in this browser. Use Edge or Chrome.');
  shutUp();
  if (rec) { const old = rec; rec = null; old.abort(); }
  pushToTalk = true; clearUtterance();
  chime();
  setTimeout(startRec, 80);
}

// ---------- Controls ----------
function updateButtons() {
  $('wakeBtn').classList.toggle('on', wakeMode);
  $('muteBtn').classList.toggle('on', voiceOn);
  $('muteBtn').textContent = voiceOn ? 'Voice on' : 'Voice off';
  render();
}
$('wakeBtn').onclick = () => {
  wakeMode = !wakeMode;
  if (wakeMode) startRec(); else if (rec) rec.abort();
  updateButtons();
};
$('muteBtn').onclick = () => { voiceOn = !voiceOn; if (!voiceOn) shutUp(); updateButtons(); };
$('stopBtn').onclick = stopAll;
$('reloadBtn').onclick = () => location.reload();
$('newBtn').onclick = () => { stopAll(); post('/api/reset'); };
// Auto mode: one click by the user is the consent; the server remembers it across restarts.
let autoOn = false;
function setAuto(on) {
  autoOn = !!on;
  $('autoBtn').classList.toggle('on', autoOn);
  $('autoBtn').classList.toggle('auto-on', autoOn);
  $('autoBtn').textContent = autoOn ? '⚡ Auto: on' : 'Auto: off';
}
$('autoBtn').onclick = () => postJson('/api/auto', { on: !autoOn });
$('micBtn').onclick = talk;
$('reactor').onclick = talk;
$('form').onsubmit = (e) => { e.preventDefault(); send($('input').value); $('input').value = ''; };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') stopAll();
  if (e.code === 'Space' && e.ctrlKey) { e.preventDefault(); talk(); }
});

$('bootBtn').onclick = async () => {
  $('boot').remove();
  try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop()); } catch {}
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  wakeMode = !!SR;
  if (wakeMode) startRec();
  updateButtons();
  const h = new Date().getHours();
  const greet = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const line = `${greet}, ${CFG.honorific}. All systems online.`;
  addMsg('eve', line + (SR ? ` Say "${CFG.wakeWord}" followed by your request.` : ''));
  say(line);
};
if (!SR) $('bootNote').textContent = 'Voice input needs Edge or Chrome. Text chat works everywhere.';
updateButtons();
// In Eve's own app window (opened with autoplay allowed) skip the click once the mic is already allowed.
if (new URLSearchParams(location.search).has('app') && navigator.permissions) {
  navigator.permissions.query({ name: 'microphone' })
    .then((p) => { if (p.state === 'granted' && $('boot')) $('bootBtn').click(); })
    .catch(() => {});
}
</script>
